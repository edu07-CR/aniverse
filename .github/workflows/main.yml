name: Tornar Admin

on:
  workflow_dispatch: # Isso cria o botão "Run workflow" para você rodar na mão

jobs:
  tornar_admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Instalar firebase-admin
        run: npm install firebase-admin
        
      - name: Rodar script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tornar-admin.js
