<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agenda de lançamentos de animes - Dublado e Legendado - AniVerse">
    <title>AniVerse - Agenda de Lançamentos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232b7fff'/><text x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>AV</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --bg: #0b0e14; --bg-2: #121721; --bg-3: #1a202c;
            --border: #1e2638; --border-2: #2d3748;
            --text: #ffffff; --text-muted: #9ca3af; --text-dim: #718096;
            --primary: #8b5cf6; --primary-hover: #7c3aed; --blue: #2b7fff;
            --accent: #38bdf8; --success: #10b981; --danger: #ef4444;
            --legendado: #22c55e; --dublado: #eab308;
        }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        header {
            background-color: var(--bg-2); padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px); flex-wrap: wrap; gap: 15px;
        }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo { background-color: var(--blue); color: white; font-weight: bold; padding: 5px 10px; border-radius: 6px; font-size: 18px; }
        .brand-name { font-size: 20px; font-weight: bold; }
        .badge-tag { background-color: #6b21a8; font-size: 11px; padding: 3px 8px; border-radius: 12px; color: #d8b4fe; }
        nav { display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 5px; transition: color 0.2s; padding: 4px 0; position: relative; }
        nav a.active, nav a:hover { color: var(--text); }
        nav a.active::after { content: ''; position: absolute; bottom: -18px; left: 0; right: 0; height: 2px; background: var(--primary); border-radius: 2px; }
        nav a.admin-link { color: var(--primary); }
        .search-user { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .search-bar { background-color: var(--bg-3); border: 1px solid var(--border-2); padding: 8px 15px; border-radius: 20px; color: white; outline: none; font-size: 13px; width: 200px; transition: border-color 0.2s, width 0.3s; }
        .search-bar:focus { border-color: var(--primary); width: 240px; }
        .user-profile { background-color: var(--bg-3); padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; transition: background 0.2s; }
        .user-profile:hover { background: #252d3d; }
        .menu-toggle { display: none; background: var(--bg-3); border: 1px solid var(--border-2); color: white; font-size: 20px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }

        .temporada-info {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(168, 85, 247, 0.05));
            border: 1px solid var(--primary); border-radius: 20px;
            padding: 6px 16px; font-size: 13px; font-weight: bold;
            color: #d8b4fe; margin-bottom: 15px;
        }
        .temporada-info .contador {
            color: var(--text-muted); font-weight: normal;
            font-size: 12px;
        }

        .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }

        .filters-bar {
            background-color: var(--bg-2); border: 1px solid var(--border);
            border-radius: 10px; padding: 12px 18px; margin-bottom: 25px;
            display: flex; justify-content: space-between; align-items: center;
            gap: 15px; flex-wrap: wrap;
        }
        .filters-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filters-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .idioma-filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .idioma-btn {
            background-color: var(--bg-3); color: var(--text-muted);
            border: 1px solid var(--border-2); padding: 6px 14px;
            border-radius: 20px; font-size: 12px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .idioma-btn.active, .idioma-btn:hover { background-color: var(--primary); color: white; border-color: var(--primary); }
        .idioma-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .idioma-btn[data-idioma="legendado"] .dot { background: var(--legendado); }
        .idioma-btn[data-idioma="dublado"] .dot { background: var(--dublado); }
        .idioma-btn[data-idioma="todos"] .dot { background: var(--accent); }

        .api-status { font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 6px; }
        .api-status::before { content: ''; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }

        .days-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: thin; }
        .days-tabs::-webkit-scrollbar { height: 6px; }
        .days-tabs::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
        .day-btn { background-color: var(--bg-2); color: var(--text-muted); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .day-btn.active, .day-btn:hover { background-color: var(--primary); color: white; border-color: var(--primary); }
        .day-btn .today-badge { background: var(--success); color: white; font-size: 9px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: bold; letter-spacing: 0.5px; }

        .legenda { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; padding: 12px 15px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; }
        .legenda-item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
        .legenda-dot { width: 10px; height: 10px; border-radius: 50%; }
        .legenda-dot.legendado { background: var(--legendado); }
        .legenda-dot.dublado { background: var(--dublado); }
        .legenda-dot.em-breve { background: var(--text-dim); }

        .schedule-list { display: flex; flex-direction: column; gap: 15px; }
        .schedule-item {
            background-color: var(--bg-2); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px;
            display: flex; align-items: stretch; gap: 20px;
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .schedule-item:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.15); }

        .schedule-info { display: flex; align-items: flex-start; gap: 15px; flex: 1; min-width: 0; }
        .schedule-img { width: 80px; height: 110px; object-fit: cover; border-radius: 8px; flex-shrink: 0; border: 1px solid var(--border-2); }
        .schedule-details { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
        .schedule-title { font-size: 16px; font-weight: bold; line-height: 1.3; }
        .schedule-ep { font-size: 13px; color: var(--text-muted); }

        .lancamentos-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
        .lancamento-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; width: fit-content; border: 1px solid; transition: transform 0.2s; }
        .lancamento-badge:hover { transform: translateX(3px); }
        .lancamento-badge .idioma-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .lancamento-badge .horario { font-variant-numeric: tabular-nums; font-weight: bold; }
        .lancamento-badge .plataforma { font-size: 11px; opacity: 0.8; font-weight: normal; }
        .lancamento-badge.legendado { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.4); color: #86efac; }
        .lancamento-badge.legendado .idioma-dot { background: var(--legendado); }
        .lancamento-badge.dublado { background: rgba(234, 179, 8, 0.1); border-color: rgba(234, 179, 8, 0.4); color: #fde047; }
        .lancamento-badge.dublado .idioma-dot { background: var(--dublado); }
        .lancamento-badge.em-breve { background: rgba(113, 128, 150, 0.1); border-color: rgba(113, 128, 150, 0.3); color: var(--text-dim); }
        .lancamento-badge.em-breve .idioma-dot { background: var(--text-dim); }

        .schedule-actions { display: flex; flex-direction: column; gap: 8px; justify-content: center; flex-shrink: 0; }
        .btn-watch-small { background-color: var(--primary); color: white; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; transition: background 0.2s, transform 0.2s; white-space: nowrap; text-align: center; display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; }
        .btn-watch-small:hover { background-color: var(--primary-hover); transform: scale(1.03); }

        .btn-notify-small {
            background: transparent; color: var(--text-muted);
            padding: 8px 14px; border-radius: 8px;
            font-size: 12px; font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap; text-align: center;
            border: 1px solid var(--border-2);
            cursor: pointer;
            display: flex; align-items: center; gap: 5px; justify-content: center;
        }
        .btn-notify-small:hover { border-color: var(--primary); color: var(--primary); }
        .btn-notify-small.ativo {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .no-anime { background-color: var(--bg-2); border: 1px dashed var(--border-2); border-radius: 10px; padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
        .no-anime span { font-size: 32px; display: block; margin-bottom: 10px; }

        .skeleton { background: linear-gradient(90deg, var(--bg-2) 25%, #1f2733 50%, var(--bg-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; height: 140px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-2); border: 1px solid var(--border-2); border-left: 4px solid var(--primary); padding: 12px 18px; border-radius: 8px; font-size: 13px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideIn 0.3s ease; min-width: 220px; }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 900px) {
            .menu-toggle { display: block; }
            nav { display: none; width: 100%; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
            nav.open { display: flex; }
            nav a.active::after { display: none; }
            nav a.active { color: var(--primary); }
            .search-bar { width: 100%; }
            .search-bar:focus { width: 100%; }
        }
        @media (max-width: 640px) {
            header { padding: 12px 15px; }
            .schedule-item { flex-direction: column; }
            .schedule-info { flex-direction: row; }
            .schedule-actions { flex-direction: row; }
            .btn-watch-small, .btn-notify-small { flex: 1; }
            .schedule-img { width: 70px; height: 95px; }
            .page-title { font-size: 20px; }
            .day-btn { padding: 8px 14px; font-size: 13px; }
            .filters-bar { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            .brand-name, .badge-tag { display: none; }
            .container { padding: 0 12px; }
            .schedule-title { font-size: 14px; }
            .legenda { font-size: 11px; gap: 12px; }
        }
        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">AV</div>
            <div class="brand-name">AniVerse</div>
            <span class="badge-tag">Fã-Clube</span>
        </div>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir menu">☰</button>
        <nav id="mainNav">
            <a href="agenda.html" class="active">📅 Agenda</a>
            <a href="meus-animes.html">🔔 Meus Animes</a>
            <a href="admin.html" class="admin-link">⚙️ Admin</a>
        </nav>
        <div class="search-user">
            <input type="text" class="search-bar" placeholder="Buscar animes...">
            <div class="user-profile">
                <span>🦊</span>
                <strong>OtakuMaster</strong>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">📅 Agenda de Lançamentos</h1>

        <div class="temporada-info" id="temporadaInfo">
            <span id="temporadaTexto">🍂 Outono 2026</span>
            <span class="contador" id="temporadaContador">0 animes</span>
        </div>

        <p class="page-subtitle">Acompanhe quando saem os episódios <strong>legendados</strong> e <strong>dublados</strong> no Brasil.</p>

        <div class="filters-bar">
            <div class="filters-bar-left">
                <span class="filters-label">Filtrar:</span>
                <div class="idioma-filters" id="idiomaFilters">
                    <button class="idioma-btn active" data-idioma="todos"><span class="dot"></span> Todos</button>
                    <button class="idioma-btn" data-idioma="legendado"><span class="dot"></span> Legendado</button>
                    <button class="idioma-btn" data-idioma="dublado"><span class="dot"></span> Dublado</button>
                </div>
            </div>
            <div class="api-status">Agenda atualizada</div>
        </div>

        <div class="days-tabs" id="daysTabs">
            <button class="day-btn" data-dia="segunda">Segunda-feira</button>
            <button class="day-btn" data-dia="terca">Terça-feira</button>
            <button class="day-btn" data-dia="quarta">Quarta-feira</button>
            <button class="day-btn" data-dia="quinta">Quinta-feira</button>
            <button class="day-btn" data-dia="sexta">Sexta-feira</button>
            <button class="day-btn" data-dia="sabado">Sábado</button>
            <button class="day-btn" data-dia="domingo">Domingo</button>
        </div>

        <div class="legenda">
            <div class="legenda-item"><span class="legenda-dot legendado"></span> Legendado</div>
            <div class="legenda-item"><span class="legenda-dot dublado"></span> Dublado</div>
            <div class="legenda-item"><span class="legenda-dot em-breve"></span> Em breve</div>
        </div>

        <div class="schedule-list" id="scheduleList"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="animes.js"></script>

    <script>
        const STORAGE_AGENDA = 'aniverse_agenda_custom';

        function toggleMenu() {
            document.getElementById('mainNav').classList.toggle('open');
        }

        function showToast(msg, tipo = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + tipo;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const PLATAFORMAS_LINKS = {
            crunchyroll: { nome: 'Crunchyroll', gerarLink: (a) => `https://www.crunchyroll.com/pt-br/search?q=${encodeURIComponent(a.titulo)}` },
            netflix: { nome: 'Netflix', gerarLink: (a) => `https://www.netflix.com/search?q=${encodeURIComponent(a.titulo)}` },
            amazon: { nome: 'Prime Video', gerarLink: (a) => `https://www.amazon.com.br/s?k=${encodeURIComponent(a.titulo)}` },
            hidive: { nome: 'HIDIVE', gerarLink: (a) => `https://www.hidive.com/search?q=${encodeURIComponent(a.titulo)}` }
        };

        function carregarAgendaCustom() {
            try {
                const raw = localStorage.getItem(STORAGE_AGENDA);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function agruparPorDia(lista) {
            const grupos = { segunda: [], terca: [], quarta: [], quinta: [], sexta: [], sabado: [], domingo: [] };
            lista.forEach(item => {
                if (grupos[item.dia]) grupos[item.dia].push(item);
            });
            return grupos;
        }

        let idiomaFiltro = 'todos';

        function getDiaAtual() {
            const dias = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
            return dias[new Date().getDay()];
        }

        function marcarHoje() {
            const diaHoje = getDiaAtual();
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.dataset.dia === diaHoje && !btn.querySelector('.today-badge')) {
                    btn.innerHTML += ' <span class="today-badge">HOJE</span>';
                }
            });
        }

        function mostrarSkeleton() {
            document.getElementById('scheduleList').innerHTML = '<div class="skeleton"></div>'.repeat(3);
        }

        function renderLancamentos(lancamento) {
            const badges = [];
            if (lancamento.legendado) {
                badges.push(`
                    <div class="lancamento-badge legendado">
                        <span class="idioma-dot"></span>
                        <span>Legendado</span>
                        <span class="horario">${lancamento.legendado.horario}</span>
                        <span class="plataforma">• ${PLATAFORMAS_LINKS[lancamento.legendado.plataforma]?.nome || lancamento.legendado.plataforma}</span>
                    </div>
                `);
            } else {
                badges.push(`<div class="lancamento-badge em-breve"><span class="idioma-dot"></span><span>Legendado • em breve</span></div>`);
            }
            if (lancamento.dublado) {
                badges.push(`
                    <div class="lancamento-badge dublado">
                        <span class="idioma-dot"></span>
                        <span>Dublado</span>
                        <span class="horario">${lancamento.dublado.horario}</span>
                        <span class="plataforma">• ${PLATAFORMAS_LINKS[lancamento.dublado.plataforma]?.nome || lancamento.dublado.plataforma}</span>
                    </div>
                `);
            } else {
                badges.push(`<div class="lancamento-badge em-breve"><span class="idioma-dot"></span><span>Dublado • em breve</span></div>`);
            }
            return badges.join('');
        }

        function passaFiltroIdioma(lancamento) {
            if (idiomaFiltro === 'todos') return true;
            if (idiomaFiltro === 'legendado') return !!lancamento.legendado;
            if (idiomaFiltro === 'dublado') return !!lancamento.dublado;
            return true;
        }

        function filtrarDia(dia, elementoBotao) {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            if (elementoBotao) elementoBotao.classList.add('active');

            mostrarSkeleton();

            setTimeout(() => {
                const agenda = carregarAgendaCustom();
                const grupos = agruparPorDia(agenda);
                const lista = grupos[dia] || [];
                const listaFiltrada = lista.filter(passaFiltroIdioma);

                const container = document.getElementById('scheduleList');
                container.innerHTML = '';

                if (agenda.length === 0) {
                    container.innerHTML = `
                        <div class="no-anime">
                            <span>📭</span>
                            Nenhum anime cadastrado ainda.<br>
                            <small style="color: var(--text-dim); font-size: 12px; margin-top: 8px; display: block;">
                                Acesse <a href="admin.html" style="color: var(--primary);">admin.html</a> para adicionar.
                            </small>
                        </div>`;
                    return;
                }

                if (listaFiltrada.length === 0) {
                    let mensagem = 'Nenhum lançamento agendado para este dia.';
                    if (idiomaFiltro === 'legendado') mensagem = 'Nenhum lançamento legendado para este dia.';
                    if (idiomaFiltro === 'dublado') mensagem = 'Nenhum lançamento dublado para este dia.';
                    container.innerHTML = `
                        <div class="no-anime">
                            <span>💤</span>
                            ${mensagem}<br>
                            <small style="color: var(--text-dim); font-size: 12px;">Tente outro dia ou outro filtro.</small>
                        </div>`;
                    return;
                }

                listaFiltrada.forEach(lancamento => {
                    const anime = typeof getAnime === 'function' ? getAnime(lancamento.animeId) : null;
                    if (!anime) return;

                    let plataformaBotao = 'crunchyroll';
                    if (lancamento.legendado) plataformaBotao = lancamento.legendado.plataforma;
                    else if (lancamento.dublado) plataformaBotao = lancamento.dublado.plataforma;

                    const linkAssistir = PLATAFORMAS_LINKS[plataformaBotao]?.gerarLink(anime) || '#';
                    const ativo = isNotificacaoAtiva(anime.id);

                    const item = document.createElement('div');
                    item.className = 'schedule-item';
                    item.innerHTML = `
                        <div class="schedule-info">
                            <img src="${anime.img}" class="schedule-img" alt="Capa de ${anime.titulo}" loading="lazy"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 80 110%22%3E%3Crect fill=%22%231a202c%22 width=%2280%22 height=%22110%22/%3E%3C/svg%3E'">
                            <div class="schedule-details">
                                <div class="schedule-title">${anime.titulo}</div>
                                <div class="schedule-ep">📺 Episódio ${String(lancamento.ep).padStart(2, '0')}</div>
                                <div class="lancamentos-list">${renderLancamentos(lancamento)}</div>
                            </div>
                        </div>
                        <div class="schedule-actions">
                            <a href="${linkAssistir}" target="_blank" rel="noopener noreferrer"
                               class="btn-watch-small">▶ Assistir</a>
                            <button class="btn-notify-small ${ativo ? 'ativo' : ''}"
                                    onclick="toggleNotificacao('${anime.id}', event)">
                                🔔 ${ativo ? 'Ativado' : 'Me avisa'}
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });

                showToast(`📅 ${listaFiltrada.length} lançamento(s) para ${dia}`);
            }, 250);
        }

        /* ===== NOTIFICAÇÃO ===== */
        function getNotificacoes() {
            try { return JSON.parse(localStorage.getItem('aniverse_notificacoes') || '[]'); }
            catch { return []; }
        }
        function salvarNotificacoes(lista) {
            localStorage.setItem('aniverse_notificacoes', JSON.stringify(lista));
        }
        function isNotificacaoAtiva(animeId) {
            return getNotificacoes().includes(animeId);
        }

        function toggleNotificacao(animeId, event) {
            event.stopPropagation();
            const lista = getNotificacoes();
            const idx = lista.indexOf(animeId);
            const btn = event.currentTarget;

            if (idx >= 0) {
                lista.splice(idx, 1);
                btn.classList.remove('ativo');
                btn.innerHTML = '🔔 Me avisa';
                showToast('Notificação desativada');
            } else {
                lista.push(animeId);
                btn.classList.add('ativo');
                btn.innerHTML = '🔔 Ativado';
                showToast('✅ Você será avisado quando sair!', 'success');
            }
            salvarNotificacoes(lista);
        }

        /* ===== TEMPORADA ===== */
        function renderTemporada() {
            if (typeof TEMPORADA_ATUAL === 'undefined') return;
            document.getElementById('temporadaTexto').textContent =
                `${TEMPORADA_ATUAL.emoji} ${TEMPORADA_ATUAL.nome}`;
        }

        function atualizarContadorTemporada() {
            if (typeof ANIMES_LISTA === 'undefined') return;
            const agenda = carregarAgendaCustom();
            /* Conta animes únicos cadastrados na agenda */
            const unicos = new Set(agenda.map(a => a.animeId));
            document.getElementById('temporadaContador').textContent =
                `${unicos.size} anime${unicos.size !== 1 ? 's' : ''} na agenda`;
        }

        document.getElementById('daysTabs').addEventListener('click', e => {
            const btn = e.target.closest('.day-btn');
            if (!btn) return;
            filtrarDia(btn.dataset.dia, btn);
        });

        document.getElementById('idiomaFilters').addEventListener('click', e => {
            const btn = e.target.closest('.idioma-btn');
            if (!btn) return;
            document.querySelectorAll('.idioma-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            idiomaFiltro = btn.dataset.idioma;
            const diaAtivo = document.querySelector('.day-btn.active');
            if (diaAtivo) filtrarDia(diaAtivo.dataset.dia, diaAtivo);
        });

        window.addEventListener('focus', () => {
            const diaAtivo = document.querySelector('.day-btn.active');
            if (diaAtivo) filtrarDia(diaAtivo.dataset.dia, diaAtivo);
            atualizarContadorTemporada();
        });

        window.addEventListener('load', () => {
            renderTemporada();
            marcarHoje();
            atualizarContadorTemporada();
            const diaHoje = getDiaAtual();
            const btnHoje = document.querySelector(`.day-btn[data-dia="${diaHoje}"]`);
            filtrarDia(diaHoje, btnHoje);
        });
    </script>
</body>
</html>
